# Replace domain and certificate paths before enabling this site.
server {
    listen 80;
    server_name practice.example.com;
    return 301 https://practice.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name practice.example.com;
    ssl_certificate /etc/papr/tls/practice.example.com/fullchain.pem;
    ssl_certificate_key /etc/papr/tls/practice.example.com/privkey.pem;
    root /opt/papr/web/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    location /admin/api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
